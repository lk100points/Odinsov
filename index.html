<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Заезд в Одинцово</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:monospace;color:#cfe}
canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#ctl{display:none}body.play #ctl{display:block}
.b{position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid #8fc;color:#fff;font:bold 13px monospace;touch-action:none;bottom:6vh}
#bl{left:3vw}#br{left:calc(3vw + 76px)}#gas{right:3vw;background:rgba(0,255,100,.2)}#brk{right:calc(3vw + 76px);background:rgba(255,60,60,.2)}
#vw{left:calc(50% - 74px);width:60px;height:40px;border-radius:10px}#rl{left:calc(50% + 14px);width:60px;height:40px;border-radius:10px}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,5,12,.86);overflow:auto;text-align:center;gap:8px;padding:10px;box-sizing:border-box}
h1{font-size:clamp(26px,7vw,56px);margin:0;color:#ff7a30;text-shadow:3px 3px #400;line-height:1}h1.r{color:#2f6}h2{margin:0}
#ov button{font:bold 16px monospace;padding:10px 22px;background:#12202c;color:#cfe;border:2px solid #4a8;border-radius:6px}
#ov button.on{background:#2a6;color:#000}#ov button:disabled{opacity:.4}
.tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.tabs button{padding:6px 10px!important;font-size:13px!important}
.list{width:min(520px,96vw);max-height:56vh;overflow:auto}.it{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:6px;border-bottom:1px solid #234}
.sw{display:inline-block;width:22px;height:22px;border:1px solid #fff;margin-right:8px;vertical-align:middle}small{color:#8ab}
</style></head><body>
<canvas id="c"></canvas>
<div id="ctl"><button class="b" id="bl">◀</button><button class="b" id="br">▶</button><button class="b" id="brk">ТОРМОЗ</button><button class="b" id="gas">ГАЗ</button><button class="b" id="vw">ВИД</button><button class="b" id="rl">R</button></div>
<div id="ov"></div>
<script src="game.js"></script></body></html>
